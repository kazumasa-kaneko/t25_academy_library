                <div class="page_contents">
                    <form id="book_register_form" th:object="${bookMstDto}" th:action="@{/book/add}" method="post">
                        <div class="mb30 flexarea">
                            <span>
                                <a th:href="@{/book/index}" class="link">← 一覧へ戻る</a>
                        </span>
                        </div>
                        <table>
                            <caption></caption>
                            <tbody>
                                <tr>
                                    <th scope="col"><span style="color: red;"></span>*は必須項目です</span></th>
                                </tr>

                                    <th scope="col">書籍名<span style="color: red;"></span>*</span></th>
                                    <td>
                                        <input type="text" name="title" th:field="*{title}" placeholder="書籍名を入力"/>

                                            <li th:text="${err}"></li>
                                        </ul>
                                       
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="col">ISBN<span style="color: red;"></span>*</span></th>
                                    <td>

                                        </ul>                                   
                                     </td>
                                </tr>
                               
                            </tbody>
                        </table>
